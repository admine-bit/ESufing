[account]
; 更换校园网账号时修改，实际账号只写入被 Git 忽略的 config.ini。
username =
; 修改校园网密码后更新，不要把实际密码写入示例文件。
password =

[network]
; 多网卡时指定校园网接口，留空使用系统默认路由；本机绿联网卡为 wlxec1ac353bc7c。
interface =
; 需要脚本自动连接 Wi-Fi 时填写信号名称，有线连接时留空。
ssid =
; 修改学校的 BYOD 入口时调整，只向此入口发送学校账号。
byod_url = http://172.17.18.2:30004
; 网络响应较慢时适当增加，单位为秒。
timeout = 8
; 校园网自动获取的 DNS 不可用时调整，多个备用 IPv4 地址用逗号分隔；仅供当前网卡查询。
fallback_dns = 202.96.128.166,202.96.128.86
; DNS 全部不可用时直连的探测服务 IPv4；服务地址变更时修改，多个地址用逗号分隔。
probe_ipv4 = 220.181.104.183,202.69.4.32
; 天翼认证域名无法解析时使用的 IPv4；认证服务器地址变更时修改。
portal_ipv4 = 125.88.59.131

[usb]
; USB 无线网卡名称改变或换网卡时修改，供 start-usb.sh 使用。
interface = wlxec1ac353bc7c

[pcie]
; PCIe 无线网卡名称改变或换网卡时修改，供 start-pcie.sh 使用。
interface = wlp6s0

[runtime]
; login 登录并检查外网后退出，keepalive 持续检测并在断线时重登。
mode = keepalive
; keepalive 模式检测间隔，单位为秒，网络不稳定时可适当调小。
interval = 30
; 开机或刚连接 Wi-Fi 时网络尚未就绪，可增加首次登录的网络重试次数。
startup_retries = 5
; 网络失败后再次尝试的等待时间，单位为秒；网络恢复较慢时可适当增加。
startup_retry_interval = 5
